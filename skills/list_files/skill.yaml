name: list_files
version: "1.0"
description: "List files in a directory with optional filtering"
author: ragnarok
risk_level: low
timeout_seconds: 10
parameters:
  - name: directory
    type: string
    required: false
    default: "."
    description: "Directory path to list"
  - name: extension
    type: string
    required: false
    description: "Filter by file extension (e.g. .py, .txt)"
entrypoint: run.py
